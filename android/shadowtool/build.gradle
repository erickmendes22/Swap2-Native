plugins { id 'com.android.application' version '8.13.2' }
android {
    namespace 'com.swap2native.shadowtool'
    compileSdk 35
    defaultConfig {
        applicationId 'com.swap2native.ocarina.shadowtool'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies {
    // Official Android AAR: native Zstd for the NUP container and Ocarina's
    // dictionary-compressed SARC resources. It includes an arm64-v8a .so.
    implementation 'com.github.luben:zstd-jni:1.5.7-7@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.github.luben:zstd-jni:1.5.7-7'
}
