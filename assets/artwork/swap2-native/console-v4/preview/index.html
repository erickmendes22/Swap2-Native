function enhance(view){
 if(view!=='settings')return;const rows=document.querySelector('.rows');if(!rows)return;
 rows.innerHTML=`<div class="theme-card"><b>Tema</b><div class="theme-choices"><button onclick="selectTheme('light')"><div class="mini-theme light"></div>Claro</button><button onclick="selectTheme('dark')"><div class="mini-theme dark"></div>Escuro</button><button onclick="selectTheme('system')"><div class="mini-theme"></div>Seguir o sistema</button></div></div><div class="setting"><div><b>Animação de abertura</b><small>Logo animada ao abrir o aplicativo.</small></div><span></span><input class="switch" type="checkbox" aria-label="Animação de abertura" checked></div><div class="setting"><div><b>Reduzir movimento</b><small>Transições mais discretas.</small></div><span></span><input class="switch" type="checkbox" aria-label="Reduzir movimento"></div><div class="setting"><div><b>Sons da interface</b><small>Feedback ao navegar e confirmar.</small></div><span></span><input class="switch" type="checkbox" aria-label="Sons da interface" checked onchange="document.getElementById('sound').checked=this.checked"></div><p class="muted">Demonstração visual; não altera as preferências do aplicativo.</p>`;
}
function selectTheme(mode){const dark=mode==='dark'||mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches;document.getElementById('shell').classList.toggle('dark',dark);cue('confirm');}
function reference(kind,play=true){const files={library:'library-rich-v3.png',settings:'settings-general-rich-v3.png',game:'settings-game-rich-v3.png'};const panel=document.getElementById('referencePane');panel.innerHTML='<img src="../mockups/'+files[kind]+'" alt="Referência visual '+kind+'">';panel.style.display='flex';if(play)cue('panel_open');}
function interactive(){document.getElementById('referencePane').style.display='none';screen(current);}
function category(b){cue('focus');document.querySelectorAll('.categories button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.rows').innerHTML='<div class="setting">'+b.textContent+'<span>Categoria de referência</span></div><p class="muted">A implementação nativa usará as opções reais já existentes no aplicativo.</p>';}
document.getElementById('navigation').innerHTML=[['library','Biblioteca'],['folder','Pasta'],['controller','Controles'],['settings','Configurações'],['profile','Perfil']].map(([id,label])=>`<button aria-label="${label}" title="${label}" onclick="nav('${id==='library'?'library':id==='folder'?'empty':'settings'}')">${icon(id)}</button>`).join('');
document.getElementById('sounds').innerHTML=Object.keys(sounds).map(id=>`<button onclick="cue('${id}',true)">${cueLabels[id]} · ${Math.round(sounds[id].duration_ms)} ms</button>`).join('');
document.addEventListener('keydown',e=>{if(current==='library'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();choose(Math.max(0,Math.min(3,selected+(e.key==='ArrowRight'?1:-1))));}if(e.key==='Escape'){skipBoot();nav('library');}});screen('library');reference('library',false);
</script></html>
