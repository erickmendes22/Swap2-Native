name: Android bug report
description: Swap2-Native on Android crashes, hangs, draws wrong, runs slowly or will not prepare a game
labels: [android]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Your phone is probably not the one this was tested on, so these details are what a problem is traced with.
        Never attach game files, keys or anything extracted from a game. Logs and screenshots are fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw. Say whether it happens every time, and where in the game.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      description: Maker and model.
      placeholder: "POCO F7 Ultra"
    validations:
      required: true
  - type: input
    id: chip
    attributes:
      label: Chip and RAM
      placeholder: "Snapdragon 8 Elite, 16 GB"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "Android 16"
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: GPU driver (Settings › GPU driver)
      options:
        - System (Qualcomm)
        - Turnip
        - Other custom driver
    validations:
      required: true
  - type: input
    id: driver_version
    attributes:
      label: Driver version, if custom
      placeholder: "Turnip 26.0.0"
  - type: input
    id: game
    attributes:
      label: Game title ID and version
      description: As the game's card shows them. The README's Games table lists the versions that run.
      placeholder: "0400486024DEC000, update 131072"
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Swap2-Native release
      description: Settings › About shows the build tag.
      placeholder: "Swap2-Native 0.1 · 8b077f1"
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Readiness check result (Settings › Readiness check)
      options:
        - Pass
        - Fail
        - Not run
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Settings › Share log (or the game's ⋯ › Share log) right after the problem, then drag the file here.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Settings you changed (resolution, frame rate cap, frame generation), a phone cooler, screenshots.
