name: Ocarina foliage density and shadow caster GPU validation
on:
  push:
    branches: [research/ocarina-foliage-density-shadow-resolution]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run actual C ABI and GPU geometry-density regressions
        run: |
          python3 -m unittest dm.gfx.tools.tests.test_ocarina_foliage_density -v
          python3 -m unittest dm.gfx.tools.tests.test_ocarina_visual_quality_patches -v
          python3 -m unittest dm.gfx.tools.tests.test_ocarina_effect_quality -v
      - name: Install Android NDK and CMake (recover partial SDK downloads)
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          SHADER_TOOLS="$NDK/shader-tools/linux-x86_64"
          # Install small SDK packages separately from the large NDK archive:
          # a corrupt NDK ZIP must not leave the other packages uninstalled.
          "$SDKMGR" --install "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          ndk_ready() {
            [ -s "$NDK/source.properties" ] &&
            [ -x "$SHADER_TOOLS/glslc" ] &&
            [ -x "$SHADER_TOOLS/spirv-val" ] &&
            [ -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]
          }
          for attempt in 1 2 3 4; do
            if ndk_ready; then
              echo "NDK already complete; no download needed."
              break
            fi
            echo "NDK 28.2.13676358 install attempt $attempt/4"
            # Failed sdkmanager ZIP extraction can leave a half-created NDK.
            # This is an ephemeral runner; only touch this precise NDK path.
            if [ -d "$NDK" ] && ! ndk_ready; then rm -rf -- "$NDK"; fi
            if "$SDKMGR" --install "ndk;28.2.13676358" && ndk_ready; then
              echo "NDK installation verified."
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::NDK download/install failed after four verified attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          if ! ndk_ready; then
            echo "::error::NDK was not installed completely" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$SHADER_TOOLS" >> "$GITHUB_PATH"
          echo "NDK shader tools: $SHADER_TOOLS"
      - name: Test actual generated mesh task SPIR-V with validators and UBSAN
        shell: bash
        run: |
          set -euxo pipefail
          clang -O1 -g -fsanitize=address,undefined \
            dm/host/tests/t_android_memu.c \
            dm/gfx/vk_android/vka_memu_spv.c \
            dm/gfx/vk_android/vka_spvpatch.c \
            dm/gfx/vk_android/vka_shlib.c \
            dm/third_party/zstd/zstddeclib.c -lm -o "$RUNNER_TEMP/test-task-density"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/test-task-density"
      - name: Compile real Android application settings
        shell: bash
        run: |
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon -PnxGames=0400486024DEC000 -PnxApp=ootv11ios -PnxPackEngine=fake compileDebugJavaWithJavac
      - name: Compile actual Vulkan backend and task flags with NDK
        shell: bash
        run: |
          set -euxo pipefail
          python3 dm/gfx/vk_android/fsr/ndsr_spv.py
          python3 dm/gfx/vk_android/fsr/sgsr_spv.py
          python3 dm/gfx/vk_android/gsr2/gsr2_spv.py
          cmake -S android/host -B "$RUNNER_TEMP/density" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=33 -DNX_RUNTIME_PROFILE=ON -DNX_LSFG=OFF
          cmake --build "$RUNNER_TEMP/density" --target nxhost -j 4
