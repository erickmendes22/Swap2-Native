name: Ocarina GSR2 guest-view correctness (no APK)
on:
  push:
    branches: [research/gsr2-guest-view-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check source-view regression and GPU shader interface
        run: |
          set -euxo pipefail
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_gsr2_assets.py -v
      - name: Android AArch64 native C syntax gate
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          fi
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          INC=(-I dm/gfx/nvn/include -I dm/third_party/vulkan-headers/include -I dm/host)
          for src in dm/gfx/vk_android/vka_gsr2.c dm/gfx/vk_android/vka_draw.c; do
            "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -Wall -Werror=implicit-function-declaration -fsyntax-only "${INC[@]}" "$src"
          done
