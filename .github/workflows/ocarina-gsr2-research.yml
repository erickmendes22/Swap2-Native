name: Ocarina GSR2 temporal research (no APK)
on:
  push:
    branches: [research/ocarina-gsr2-360p-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify temporal inputs and licensing
        run: |
          set -euo pipefail
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_gsr2_assets.py -v
      - name: Install GPU shader tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y glslc spirv-tools
      - name: Compile Qualcomm three-pass GSR2 to validated Vulkan SPIR-V
        run: |
          set -euo pipefail
          python3 dm/gfx/vk_android/gsr2/gsr2_spv.py
          python3 dm/gfx/vk_android/gsr2/gsr2_spv.py --check
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_gsr2_assets.py -v
          printf 'GSR2: Qualcomm convert/activate/upscale SPIR-V validated for Vulkan 1.1; no APK.\n' >> "$GITHUB_STEP_SUMMARY"

  native:
    needs: shaders
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Compile Ocarina temporal Vulkan bridge with Android AArch64 NDK
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          fi
          export ANDROID_NDK_HOME="$NDK"
          python3 dm/gfx/vk_android/gsr2/gsr2_spv.py
          python3 dm/gfx/vk_android/gsr2/gsr2_spv.py --check
          python3 dm/games/game.py header 0400486024DEC000 "$RUNNER_TEMP/game_profile.h"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          INC=(-I "$RUNNER_TEMP" -I dm/gfx/nvn/include -I dm/third_party/vulkan-headers/include -I dm/third_party/libvpx -I dm/third_party/libvpx/config -I dm/third_party/stb_vorbis -I dm/host)
          for src in dm/gfx/vk_android/vka_gsr2.c dm/gfx/vk_android/vka_draw.c; do
            "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -Wall -Werror=implicit-function-declaration -fsyntax-only "${INC[@]}" "$src"
          done
          echo 'Ocarina GSR2 Android AArch64 bridge compiled' >> "$GITHUB_STEP_SUMMARY"
