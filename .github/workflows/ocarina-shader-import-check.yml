name: Ocarina shader import compatibility tests
on:
  push:
    branches: [ocarina-banana-shader-import]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test shader import, fallback compatibility and integrity
        run: |
          python3 -m unittest discover -s dm/tools/tests -p 'test_android_shaderzip.py' -v
      - name: Check Android string resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ("android/app/src/main/res/values/strings.xml", "android/app/src/main/res/values-pt/strings.xml"):
              root = ET.parse(path).getroot()
              names = [child.attrib.get("name") for child in root.findall("string")]
              assert len(names) == len(set(names)), f"duplicate string resource: {path}"
              for key in ("s2_shaders_imported_fallback", "s2_shaders_err_other_abi"):
                  assert key in names, f"missing {key}: {path}"
          PY
