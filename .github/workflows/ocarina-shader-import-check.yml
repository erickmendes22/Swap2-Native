name: Ocarina shader import compatibility tests
on:
  push:
    branches: [ocarina-banana-shader-import]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test shader import, fallback compatibility and integrity
        run: |
          python3 -m unittest discover -s dm/tools/tests -p 'test_android_shaderzip.py' -v
          python3 -m unittest discover -s dm/tools/tests -p 'test_android_packzip.py' -v
      - name: Check Android string resources
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ("android/app/src/main/res/values/strings.xml", "android/app/src/main/res/values-pt/strings.xml"):
              root = ET.parse(path).getroot()
              names = [child.attrib.get("name") for child in root.findall("string")]
              assert len(names) == len(set(names)), f"duplicate string resource: {path}"
              for key in ("s2_shaders_imported_fallback", "s2_shaders_err_other_abi"):
                  assert key in names, f"missing {key}: {path}"
          PY

  apk:
    needs: import-tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake clang zlib1g-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build on-device native translator and packer
        shell: bash
        run: |
          set -euxo pipefail
          zsh android/ondevice/build.sh "$RUNNER_TEMP/oot-banana" all
      - name: Build separate Ocarina banana-import test APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PnxGames=0400486024DEC000 \
            -PnxApp=ootbanana \
            -PnxLabel="Swap2 Ocarina Banana Import Test" \
            -PnxVersion=0.1.1-oot-v10.1-banana-import \
            -PnxPackStage="$RUNNER_TEMP/oot-banana/stage" apk
          test -s out/swap2-native-ootbanana.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Swap2-Ocarina-Banana-Import-Test-APK
          path: android/app/out/swap2-native-ootbanana.apk
          if-no-files-found: error
          retention-days: 14
