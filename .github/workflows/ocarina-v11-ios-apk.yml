name: Swap2-Native Ocarina 0.1.6 Android APK
on:
  push:
    branches: [ocarina-v11-ios-perf-from-v101, wip-ocarina-v22-gpu-structural]
    paths:
      - ci/ocarina-ios-ready.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocarina-v11-ios-apk
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zstandard for dictionary-compressed NUP regression
        run: |
          if python3 -c 'from compression import zstd'; then
            echo 'Using the Python standard-library Zstandard module'
          else
            python3 -m pip install --user --break-system-packages backports.zstd==1.8.0
          fi
      - name: Validate shader ABI and internal scene resolution profiles
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/pack_android.py dm/gfx/tools/dmsh_chain.py dm/gfx/tools/vk_android_build.py dm/games/0400486024DEC000/patches.py
          # Fail in the lightweight validation job if any converted pack
          # script still has invalid Bash syntax (before the costly APK job).
          bash -n android/ondevice/build.sh
          bash -n dm/gfx/tools/dmsh_xlate_android/build.sh
          bash -n dm/gfx/tools/dmsh_xlate_android/build_spirv_tools.sh
          python3 dm/gfx/tools/vk_abi_migrate.py --check
          python3 -m py_compile dm/gfx/tools/vk_abi_migrate.py scripts/ocarina_shader_hot_delta.py
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_abi_migration.py'
          python3 -m unittest discover -s dm/tools/tests -p 'test_android_readiness.py' -v
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            dm/host/tests/t_android_codec_backpressure.c -o /tmp/t_android_codec_backpressure
          ASAN_OPTIONS=detect_leaks=1 /tmp/t_android_codec_backpressure
          python3 -m unittest discover -s dm/tools/tests -p 'test_android_codec_async.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_cpu_written_serials.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_retired_pool_images.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pipeline_retirement.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_banana_runtime.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_vegetation_supplement.py'
          python3 dm/gfx/tools/ocarina_vegetation.py --check
          python3 -m unittest discover -s dm/tools/tests -p 'test_ocarina_vegetation_launcher.py' -v
          python3 dm/gfx/tools/mesh_vegetation_profile.py --check
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_isolated_readiness.py' -v
          mkdir -p /tmp/gpu-runtime-jvm
          javac -d /tmp/gpu-runtime-jvm \
            android/app/src/main/java/dev/nxnative/android/GpuRuntimeError.java \
            android/app/src/jvmtest/java/dev/nxnative/android/GpuRuntimeErrorJvmTest.java
          java -cp /tmp/gpu-runtime-jvm dev.nxnative.android.GpuRuntimeErrorJvmTest
          python3 -m unittest discover -s dm/tools/tests -p 'test_ocarina_shader_delta.py'
          # Verify that the first working 0.1.2 Ocarina shaders can still
          # be exported/imported byte for byte on the 0.1.6 launcher.
          command -v javac && command -v java
          python3 -m unittest discover -s dm/tools/tests -p 'test_android_shaderzip.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_cold_build_memory.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_raw_gmem_fast1.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v101_paths.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_ios_v22_gmem.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_ios_v11_gpu_discards.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v11_012_graphics.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_scene_012.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_vk_barrier_dedup.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_bar_keep.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_query_batched.py'
          python3 dm/tools/tests/test_ndsr_standin.py OcarinaLargeNdsr
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_scoped_uniform_barrier.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_attachment_stage_dependencies.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_live_memory_filter.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pool_descriptor_dedup.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_watched_images.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_gpu_write_index.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_upstream_013_015_memory.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_fps_boost_vrs.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_compute_retile.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_compute_virtual_retile.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_graphics_barrier_scopes.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pool_feedback.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_ub_deferred.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_graphics_pass_ub_barrier.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_early_occlusion.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_occlusion_fast.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_compute_dispatch_overlap.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_720p_upscale_real_gpu.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_sgsr_mesh_prewarm.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_hot_shader_overlay.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_captured_shaders.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v22_gpu_raw_vector_hints.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pack_finalize_atomic.py'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile shader translator in CI before downloading Android dependencies
        shell: bash
        run: |
          set -euxo pipefail
          dotnet build dm/third_party/ryujinx/src/Ryujinx.Graphics.Shader/Ryujinx.Graphics.Shader.csproj --configuration Release --verbosity quiet
      - name: Verify shader hashes and ABI without changing the prior stable library
        shell: bash
        run: |
          set -euxo pipefail
          python3 dm/gfx/tools/dmsh_chain.py --header
          python3 dm/gfx/tools/vk_android_build.py --header
          grep -q '#define DMSH_VK_ABI "674db0a4ff79"' dm/gfx/nvn/dmsh_chain_vk.h
          grep -q 'shader_gmem_revision.*v11_ios_raw_cache' dm/games/0400486024DEC000/game.tsv
          cat dm/gfx/nvn/dmsh_chain.h dm/gfx/nvn/dmsh_chain_vk.h
          echo "Shader chain regenerated for this checkout; no cross-ABI Banana library used." >> "$GITHUB_STEP_SUMMARY"
  apk:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Generate matching shader headers for the actual APK build
        shell: bash
        run: |
          set -euxo pipefail
          python3 dm/gfx/tools/dmsh_chain.py --header
          python3 dm/gfx/tools/vk_android_build.py --header
          grep -q '#define DMSH_VK_ABI "674db0a4ff79"' dm/gfx/nvn/dmsh_chain_vk.h
          cat dm/gfx/nvn/dmsh_chain_vk.h
      - name: Check runner native build prerequisites (no apt mirrors)
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu runner has Bash, CMake, Ninja, Clang; native scripts now use Bash.
          # apt-get update/install was failing on azure.archive.ubuntu.com DNS.
          for tool in bash ninja cmake clang; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing preinstalled native build tool: $tool" >&2
              exit 1
            fi
            echo "$tool: $(command -v "$tool")"
          done
          test -s /usr/include/zlib.h || {
            echo "::error::Runner zlib development headers missing" >&2
            exit 1
          }
          echo "Using the Android NDK shader-tools after its SDK setup step."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          SHADER_TOOLS="$NDK/shader-tools/linux-x86_64"
          # The NDK ships glslc and SPIR-V tools. Keep the existing
          # SGSR1 compilation/validation while removing Ubuntu apt DNS.
          for tool in glslc spirv-val; do
            if [ ! -x "$SHADER_TOOLS/$tool" ]; then
              echo "::error::Android NDK missing $SHADER_TOOLS/$tool" >&2
              exit 1
            fi
          done
          echo "$SHADER_TOOLS" >> "$GITHUB_PATH"
          echo "NDK shader tools: $SHADER_TOOLS"
      - name: Validate compute mesh and GPU texture feedback SPIR-V
        shell: bash
        run: |
          set -euxo pipefail
          python3 dm/gfx/tools/mesh_vegetation_profile.py --check
          clang -O1 -g -fsanitize=address,undefined \
            dm/host/tests/t_android_memu.c dm/gfx/vk_android/vka_memu_spv.c \
            dm/gfx/vk_android/vka_spvpatch.c dm/gfx/vk_android/vka_shlib.c \
            dm/third_party/zstd/zstddeclib.c -lm -o /tmp/t_android_memu
          ASAN_OPTIONS=detect_leaks=1 /tmp/t_android_memu
          clang -O1 -g -fsanitize=address,undefined \
            dm/host/tests/t_android_pool_feedback.c dm/gfx/vk_android/vka_spvpatch.c \
            -o /tmp/t_android_pool_feedback
          ASAN_OPTIONS=detect_leaks=1 /tmp/t_android_pool_feedback
      - name: Compile and verify SGSR1 720p shader from Qualcomm source
        shell: bash
        run: |
          set -euxo pipefail
          python3 dm/gfx/vk_android/fsr/sgsr_spv.py
          python3 dm/gfx/vk_android/fsr/sgsr_spv.py --check
      - name: Restore persistent V11 test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: swap2-ootv11ios-test-signing-v1
      - name: Require installed 0.1.2 signing key for install-over updates
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::0.1.2 signing key cache missing. Refusing to generate an incompatible signer." >&2
            exit 1
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          cached_fingerprint="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | awk '{print $1}')"
          echo "Cached V11 signer SHA-256: $cached_fingerprint"
          # The user's most recent 0.1.2 game log confirms signer a1c468af...
          # The restored cache key matches that installed 0.1.2 app. Build may
          # proceed only while the signer matches; an incompatible artifact is not
          # a release and will be marked as such after signing.
          echo "Most recently tested 0.1.2 APK signer: a1c468aff0b99e28c001991c94e7f1f5373493deb26e822b54a335801a76f4ad"
          if [ "$cached_fingerprint" != "a1c468aff0b99e28c001991c94e7f1f5373493deb26e822b54a335801a76f4ad" ]; then
            echo "::error::Cached signing key differs from installed 0.1.2 app; cannot produce install-over APK." >&2
            exit 1
          fi
      - name: Build Android native shader translator and packer
        shell: bash
        run: |
          set -euxo pipefail
          bash android/ondevice/build.sh "$RUNNER_TEMP/oot-v11-ios" all
      - name: Build separately installable optimized Ocarina APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PnxGames=0400486024DEC000 \
            -PnxApp=ootv11ios \
            -PnxV11SignStore="$HOME/.android/debug.keystore" \
            -PnxLabel="Swap2-Native Ocarina" \
            -PnxBranchLabel=ocarina-0.1.6 \
            -PnxVersion=0.1.6 \
            -PnxVersionCode="$GITHUB_RUN_NUMBER" \
            -PnxPackStage="$RUNNER_TEMP/oot-v11-ios/stage" apk
          test -s out/swap2-native-ootv11ios.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/swap2-native-ootv11ios.apk | grep -F "name='com.swap2native.ootv11ios'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose out/swap2-native-ootv11ios.apk
          built_fingerprint="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs out/swap2-native-ootv11ios.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}')"
          echo "Built V11 signer SHA-256: $built_fingerprint"
          if [ "$built_fingerprint" = "a1c468aff0b99e28c001991c94e7f1f5373493deb26e822b54a335801a76f4ad" ]; then
            echo "UPDATE_SIGNER_MATCH=1" >> "$GITHUB_ENV"
          else
            echo "UPDATE_SIGNER_MATCH=0" >> "$GITHUB_ENV"
            echo "::warning::Built 0.1.2 APK has a different signer from the installed 0.1.2 app. DO NOT install over existing app." >&2
            printf '%s\n' "AVISO: esta APK foi compilada para teste, mas a assinatura difere da ultima V11 instalada. NAO instala por cima. NAO e um release publico." > out/ASSINATURA-INCOMPATIVEL.txt
          fi
          cp out/swap2-native-ootv11ios.apk out/swap2-native-ocarina-0.1.6.apk
      - name: Upload signed 0.1.2 build and any signing warning
        uses: actions/upload-artifact@v4
        with:
          name: Swap2-Native-Ocarina-0.1.6-Update
          path: |
            android/app/out/swap2-native-ocarina-0.1.6.apk
            android/app/out/ASSINATURA-INCOMPATIVEL.txt
          if-no-files-found: error
          retention-days: 14
      - name: Gate update on signer matching installed 0.1.2 APK
        if: env.UPDATE_SIGNER_MATCH == '0'
        shell: bash
        run: |
          echo "::error::Not publishing an APK signed with a different key than the installed 0.1.2 app." >&2
          exit 1
