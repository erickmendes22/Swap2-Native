name: Ocarina Vulkan V22 GPU Translator Validation (no APK)
on:
  push:
    branches: [wip-ocarina-v22-gpu-structural]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate Qualcomm SGSR1 SPIR-V shader (no APK)
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y glslc spirv-tools
          python3 dm/gfx/vk_android/fsr/sgsr_spv.py
          python3 dm/gfx/vk_android/fsr/sgsr_spv.py --check
      - name: Source and sizing regression tests
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/build_ocarina_hot_shaders.py dm/gfx/vk_android/fsr/sgsr_spv.py
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_hot_shader_overlay.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_sgsr_mesh_prewarm.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_720p_upscale_real_gpu.py'
      - name: Compile shader translator after structural V21/V22 optimizations
        shell: bash
        run: |
          set -euxo pipefail
          dotnet build dm/third_party/ryujinx/src/Ryujinx.Graphics.Shader/Ryujinx.Graphics.Shader.csproj --configuration Release --verbosity quiet
      - name: Compile-check changed Android Vulkan C code (no APK)
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          python3 dm/games/game.py header 0400486024DEC000 "$RUNNER_TEMP/game_profile.h"
          INC=(-I "$RUNNER_TEMP" -I dm/gfx/nvn/include -I dm/third_party/vulkan-headers/include -I dm/third_party/libvpx -I dm/third_party/libvpx/config -I dm/third_party/stb_vorbis -I dm/host)
          for src in dm/gfx/vk_android/vka_shader.c dm/gfx/vk_android/vka_pso.c dm/gfx/vk_android/vka_present.c dm/gfx/vk_android/vka_draw.c; do
            "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -fsyntax-only "${INC[@]}" "$src"
          done
      - name: Validate raw memory hint collision safety and 128-bit vector rewrite
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v22_gpu_raw_vector_hints.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_ios_v22_gmem.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_raw_gmem_fast1.py'
          python3 dm/gfx/tools/dmsh_chain.py --header
          python3 dm/gfx/tools/vk_android_build.py --header
          echo 'Shader translation/ABI checked; no APK created.' >> "$GITHUB_STEP_SUMMARY"
