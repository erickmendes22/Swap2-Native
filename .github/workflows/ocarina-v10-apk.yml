name: Ocarina V10 Android APK
on:
  push:
    branches: [ocarina-v10-shader-gpu]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocarina-v10-apk
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python source and shader cache version
        run: |
          python3 -m py_compile scripts/pack_android.py dm/tools/gsys_dynres.py dm/games/0400486024DEC000/patches.py
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_raw_gmem_fast1.py'
          python3 dm/gfx/tools/dmsh_chain.py --header
          python3 dm/gfx/tools/vk_android_build.py --header
          git diff --exit-code -- dm/gfx/nvn/dmsh_chain.h dm/gfx/nvn/dmsh_chain_vk.h

  apk:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build on-device native translator and packer
        shell: bash
        run: |
          set -euxo pipefail
          zsh android/ondevice/build.sh "$RUNNER_TEMP/oot-v10" all
      - name: Build Ocarina V10 APK (normal and parallel)
        shell: bash
        run: |
          set -euxo pipefail
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PnxGames=0400486024DEC000 \
            -PnxPlay=true \
            -PnxVersion=0.1.1-oot-v10 \
            -PnxPackStage="$RUNNER_TEMP/oot-v10/stage" apk
          ./gradlew --no-daemon \
            -PnxGames=0400486024DEC000 \
            -PnxApp=ootv10 \
            -PnxLabel="Swap2 Ocarina V10" \
            -PnxVersion=0.1.1-oot-v10 \
            -PnxPackStage="$RUNNER_TEMP/oot-v10/stage" apk
          ls -lh out/*.apk
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Swap2-Ocarina-V10-APK
          path: android/app/out/*.apk
          if-no-files-found: error
          retention-days: 14
