name: Ocarina V11 extended GMEM validation
on:
  push:
    branches: [ocarina-v11-gmem-capacity]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test map capacity and shader import invariants
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile scripts/pack_android.py
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v11_gmem_map.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v101_paths.py' -v
          python3 -m unittest discover -s dm/tools/tests -p 'test_android_shaderzip.py' -v
      - name: Generate and show new shader chain headers
        shell: bash
        run: |
          set -euxo pipefail
          python3 dm/gfx/tools/dmsh_chain.py --header
          python3 dm/gfx/tools/vk_android_build.py --header
          cat dm/gfx/nvn/dmsh_chain.h
          cat dm/gfx/nvn/dmsh_chain_vk.h
          git diff --exit-code -- dm/gfx/nvn/dmsh_chain.h dm/gfx/nvn/dmsh_chain_vk.h

  apk:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake clang zlib1g-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build on-device native translator and packer
        shell: bash
        run: |
          set -euxo pipefail
          zsh android/ondevice/build.sh "$RUNNER_TEMP/oot-v11" all
      - name: Build separate V11 extended GMEM test APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PnxGames=0400486024DEC000 \
            -PnxApp=ootv11 \
            -PnxLabel="Swap2 Ocarina V11 GMEM" \
            -PnxVersion=0.1.1-oot-v11-gmem \
            -PnxPackStage="$RUNNER_TEMP/oot-v11/stage" apk
          test -s out/swap2-native-ootv11.apk
      - name: Upload V11 test APK
        uses: actions/upload-artifact@v4
        with:
          name: Swap2-Ocarina-V11-GMEM-Test-APK
          path: android/app/out/swap2-native-ootv11.apk
          if-no-files-found: error
          retention-days: 14
