name: Ocarina SGSR SPIR-V source parity and header sync
on:
  push:
    branches: [ocarina-v11-ios-perf-from-v101]
    paths:
      - .github/workflows/ocarina-sgsr-header-sync-once.yml
permissions:
  contents: write
jobs:
  sync-validated-shader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install shader validation and software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y glslc spirv-tools libvulkan-dev mesa-vulkan-drivers
      - name: Generate and validate the two shader variants with both store formats
        run: |
          python3 dm/gfx/vk_android/fsr/ndsr_spv.py
          python3 dm/gfx/vk_android/fsr/ndsr_spv.py --check
      - name: Validate real Vulkan pixel parity on software GPU
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          python3 -m unittest discover -s dm/tools/tests -p test_ndsr_sgsr_gpu.py -v
      - name: Commit only the checked compiled SPIR-V header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dm/gfx/vk_android/vka_ndsr_spv.h
          if git diff --cached --quiet; then
            echo "No shader header change"
          else
            git commit -m "Ocarina 169: sync tested SGSr SPIR-V header to HDR safety shader"
            git push origin HEAD:ocarina-v11-ios-perf-from-v101
          fi
