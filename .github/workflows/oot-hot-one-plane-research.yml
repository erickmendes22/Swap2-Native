name: Ocarina one unused vec4 output plane research (no APK)
on:
  push:
    branches: [research/oot-hot-one-plane-prune-20261117]
    paths:
      - .github/workflows/oot-hot-one-plane-research.yml
      - dm/gfx/vk_android/vka_oot_one_plane.h
      - dm/gfx/vk_android/vka_memu.c
      - dm/gfx/tools/tests/test_oot_hot_one_plane.py
      - dm/gfx/tools/tests/test_oot_one_plane_gpu.py
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real C policy + paired producer/consumer + old geometry invariants
        run: |
          python3 -m unittest dm.gfx.tools.tests.test_oot_hot_one_plane -v
          python3 -m unittest dm.gfx.tools.tests.test_ocarina_mesh_native_hybrid -v
      - name: Install Mesa Lavapipe and SPIR-V validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan-dev spirv-tools glslang-tools
          python3 - <<'PY'
          import glob, os
          paths = glob.glob('/usr/share/vulkan/icd.d/lvp*.json')
          assert len(paths) == 1, paths
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('VK_ICD_FILENAMES=' + paths[0] + '\\n')
          PY
      - name: Execute actual producer/consumer masked mesh shaders on Vulkan GPU
        env:
          MEMU_TEST_VULKAN: '1'
        run: |
          python3 -m unittest dm.gfx.tools.tests.test_memu_coalesced_readback.CoalescedReadback.test_mesh_producer_and_vertex_masked_pair_gpu_readback -v
      - name: Compare exactly one vec4 of removed GPU writes (8 vs 7)
        env:
          MEMU_TEST_VULKAN: '1'
        run: python3 -m unittest dm.gfx.tools.tests.test_oot_one_plane_gpu -v
      - name: Android arm64 syntax for paired producer consumer
        run: |
          set -euxo pipefail
          SWAP_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -x "$SWAP_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
          fi
          SWAP_CC="$SWAP_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          "$SWAP_CC" -std=gnu11 -D_GNU_SOURCE -fsyntax-only -Werror=implicit-function-declaration -Werror=return-type \
            -Idm/host/rt -Idm/host -Idm/gfx/nvn/include -Idm/third_party/vulkan-headers/include \
            dm/gfx/vk_android/vka_memu.c
