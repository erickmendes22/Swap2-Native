name: Ocarina incremental shaders (tests only)
on:
  push:
    branches: [wip-ocarina-incremental-shader-updates, ocarina-v11-ios-perf-from-v101]
    paths:
      - 'scripts/ocarina_shader_hot_delta.py'
      - 'scripts/build_ocarina_hot_shaders.py'
      - 'dm/gfx/tools/tests/test_ocarina_hot_shader_overlay.py'
      - 'dm/gfx/vk_android/vka_shlib.c'
      - 'dm/gfx/vk_android/vka_exec.c'
      - 'dm/gfx/vk_android/vka_draw.c'
      - 'dm/gfx/tools/tests/test_ocarina_occlusion_fast.py'
      - 'dm/gfx/tools/tests/test_ocarina_pool_feedback.py'
      - 'dm/gfx/tools/tests/test_ocarina_ub_deferred.py'
      - 'dm/gfx/tools/tests/test_ocarina_graphics_pass_ub_barrier.py'
      - 'dm/gfx/tools/tests/test_ocarina_early_occlusion.py'
      - 'dm/gfx/tools/tests/test_ocarina_captured_shaders.py'
      - 'dm/gfx/tools/tests/test_ocarina_cold_build_memory.py'
      - 'dm/gfx/tools/vk_android_build.py'
      - 'android/app/src/main/java/dev/nxnative/android/ShaderZip.java'
      - 'android/app/src/main/java/dev/nxnative/android/ShaderLibs.java'
      - 'android/app/src/jvmtest/java/dev/nxnative/android/ShaderZipJvmTest.java'
      - 'dm/tools/tests/test_android_shaderzip.py'
      - 'dm/gfx/tools/tests/test_ocarina_captured_alu_cse.py'
      - 'dm/gfx/tools/tests/test_ocarina_graphics_barrier_scopes.py'
      - 'dm/gfx/tools/tests/test_ocarina_postpass_barrier_dedup.py'
      - 'dm/gfx/tools/tests/test_ocarina_attachment_stage_dependencies.py'
      - 'dm/gfx/vk_android/vka_shader.c'
      - 'dm/gfx/vk_android/vka_ndsr.c'
      - 'dm/gfx/vk_android/vka_present.c'
      - 'dm/gfx/tools/tests/test_ocarina_720p_upscale_real_gpu.py'
      - 'dm/gfx/tools/tests/test_ocarina_scene_012.py'
      - 'android/app/src/main/java/dev/nxnative/android/Prefs.java'
      - 'android/app/src/main/java/dev/nxnative/android/GameSettings.java'
      - 'dm/tools/gsys_dynres.py'
      - 'dm/gfx/tools/tests/test_ocarina_abi_migration.py'
      - 'dm/tools/tests/test_ndsr_standin.py'
      - 'dm/host/tests/t_android_shlib.c'
      - 'dm/gfx/vk_android/vka_tex.c'
      - 'dm/gfx/vk_android/vka.h'
      - 'dm/gfx/tools/tests/test_ocarina_live_memory_filter.py'
      - 'dm/gfx/tools/tests/test_ocarina_pool_descriptor_dedup.py'
      - 'dm/gfx/tools/tests/test_ocarina_watched_images.py'
      - 'dm/gfx/tools/tests/test_ocarina_gpu_write_index.py'
      - 'scripts/pack_android.py'
      - 'android/app/src/ondevice/java/dev/nxnative/android/OcarinaShaderDelta.java'
      - 'android/app/src/ondevice/java/dev/nxnative/android/PackService.java'
      - 'android/app/src/ondevice/java/dev/nxnative/android/Job.java'
      - 'dm/games/0400486024DEC000/vk_hot_delta.tsv'
      - 'dm/tools/tests/test_ocarina_shader_delta.py'
      - 'dm/gfx/tools/tests/test_ocarina_scoped_uniform_barrier.py'
      - 'dm/gfx/tools/tests/test_ocarina_vk_barrier_dedup.py'
      - 'dm/gfx/tools/tests/test_ocarina_fps_boost_vrs.py'
      - 'dm/gfx/tools/tests/test_ocarina_bar_keep.py'
      - '.github/workflows/ocarina-incremental-shaders-ci.yml'
  workflow_dispatch:
jobs:
  verify-incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python source compile
        run: python3 -m py_compile scripts/ocarina_shader_hot_delta.py scripts/build_ocarina_hot_shaders.py scripts/pack_android.py dm/tools/tests/test_ocarina_shader_delta.py
      - name: Synthetic full-library and partial-overlay regression
        run: python3 -m unittest discover -s dm/tools/tests -p test_ocarina_shader_delta.py -v
      - name: Verified hot shader release manifest and ABI guards
        run: |
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_hot_shader_overlay.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_abi_migration.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_live_memory_filter.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_pool_descriptor_dedup.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_watched_images.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_gpu_write_index.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_occlusion_fast.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_pool_feedback.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_ub_deferred.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_graphics_pass_ub_barrier.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_early_occlusion.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_captured_shaders.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_cold_build_memory.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_captured_alu_cse.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_graphics_barrier_scopes.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_postpass_barrier_dedup.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_attachment_stage_dependencies.py -v
          cc -D_GNU_SOURCE -std=gnu11 -fsyntax-only dm/gfx/vk_android/vka_shlib.c
      - name: Syntax-check real Android Vulkan texture replay with NDK
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          python3 dm/games/game.py header 0400486024DEC000 "$RUNNER_TEMP/game_profile.h"
          INC=(-I "$RUNNER_TEMP" -I dm/gfx/nvn/include -I dm/third_party/vulkan-headers/include -I dm/third_party/libvpx -I dm/third_party/libvpx/config -I dm/third_party/stb_vorbis -I dm/host)
          "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -fsyntax-only "${INC[@]}" dm/gfx/vk_android/vka_tex.c
          "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -fsyntax-only "${INC[@]}" dm/gfx/vk_android/vka_draw.c
          "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -fsyntax-only "${INC[@]}" dm/gfx/vk_android/vka_exec.c
          "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -fsyntax-only "${INC[@]}" dm/gfx/vk_android/vka_shader.c
          "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -fsyntax-only "${INC[@]}" dm/gfx/vk_android/vka_ndsr.c
          # vka_present.c includes generated vka_present_sgsr.h; the signed
          # APK workflow generates it from SGSR1 and compiles the real source.
          # The incremental runner tests its state/logic in Python above,
          # but must not syntax-check it before this generated header exists.
      - name: Production APK full source-level regression preflight
        run: |
          set -euo pipefail
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_abi_migration.py'
          python3 -m unittest discover -s dm/tools/tests -p 'test_ocarina_shader_delta.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_raw_gmem_fast1.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v101_paths.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_ios_v22_gmem.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_ios_v11_gpu_discards.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v11_012_graphics.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_scene_012.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_vk_barrier_dedup.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_bar_keep.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_query_batched.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_scoped_uniform_barrier.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_attachment_stage_dependencies.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_live_memory_filter.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pool_descriptor_dedup.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_watched_images.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_gpu_write_index.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_upstream_013_015_memory.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_fps_boost_vrs.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_compute_retile.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_graphics_barrier_scopes.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_postpass_barrier_dedup.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pool_feedback.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_ub_deferred.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_graphics_pass_ub_barrier.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_early_occlusion.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_occlusion_fast.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_compute_dispatch_overlap.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_720p_upscale_real_gpu.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_sgsr_mesh_prewarm.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_hot_shader_overlay.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_v22_gpu_raw_vector_hints.py'
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pack_finalize_atomic.py'
      - name: On-device finalization retry regressions
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_pack_finalize_atomic.py -v
      - name: Test static engine integration against source versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java = Path('android/app/src/ondevice/java/dev/nxnative/android/PackService.java').read_text()
          assert 'List<String> hotKeys = j.hotKeys();' in java
          assert 'OcarinaShaderDelta.keys(j)' not in java
          assert 'finishedOcarinaLibrary(new File(j.pack(), "shaders"), j)' in java
          packer = Path('scripts/pack_android.py').read_text()
          assert 'compatible_ocarina_full_library(out, g, v)' in packer
          assert '--hot-keys' in java
          assert 'ShaderResults.dropFailed(xlate)' in java
          assert 'DMSH_VK_DELTA_FROM' in java
          assert 'DMSH_VK_REQUIRE_ALL' in java
          assert 'DMSH_VK_RESULTS' in java
          assert 'j.resetChainSteps()' in java
          print('Old full/manifest-delta and abort/retry flows retained alongside selected-key fast update')
          PY
