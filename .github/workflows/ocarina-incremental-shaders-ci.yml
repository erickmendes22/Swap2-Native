name: Ocarina incremental shaders (tests only)
on:
  push:
    branches: [wip-ocarina-incremental-shader-updates, ocarina-v11-ios-perf-from-v101]
    paths:
      - 'scripts/ocarina_shader_hot_delta.py'
      - 'scripts/build_ocarina_hot_shaders.py'
      - 'dm/gfx/tools/tests/test_ocarina_hot_shader_overlay.py'
      - 'dm/gfx/vk_android/vka_shlib.c'
      - 'dm/gfx/vk_android/vka_exec.c'
      - 'dm/gfx/vk_android/vka_draw.c'
      - 'dm/gfx/tools/tests/test_ocarina_occlusion_fast.py'
      - 'dm/gfx/tools/tests/test_ocarina_graphics_barrier_scopes.py'
      - 'dm/gfx/tools/tests/test_ocarina_attachment_stage_dependencies.py'
      - 'dm/gfx/vk_android/vka_shader.c'
      - 'dm/host/tests/t_android_shlib.c'
      - 'dm/gfx/vk_android/vka_tex.c'
      - 'dm/gfx/vk_android/vka.h'
      - 'dm/gfx/tools/tests/test_ocarina_live_memory_filter.py'
      - 'dm/gfx/tools/tests/test_ocarina_pool_descriptor_dedup.py'
      - 'dm/gfx/tools/tests/test_ocarina_watched_images.py'
      - 'dm/gfx/tools/tests/test_ocarina_gpu_write_index.py'
      - 'scripts/pack_android.py'
      - 'android/app/src/ondevice/java/dev/nxnative/android/OcarinaShaderDelta.java'
      - 'android/app/src/ondevice/java/dev/nxnative/android/PackService.java'
      - 'android/app/src/ondevice/java/dev/nxnative/android/Job.java'
      - 'dm/games/0400486024DEC000/vk_hot_delta.tsv'
      - 'dm/tools/tests/test_ocarina_shader_delta.py'
      - '.github/workflows/ocarina-incremental-shaders-ci.yml'
  workflow_dispatch:
jobs:
  verify-incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python source compile
        run: python3 -m py_compile scripts/ocarina_shader_hot_delta.py scripts/build_ocarina_hot_shaders.py scripts/pack_android.py dm/tools/tests/test_ocarina_shader_delta.py
      - name: Synthetic full-library and partial-overlay regression
        run: python3 -m unittest discover -s dm/tools/tests -p test_ocarina_shader_delta.py -v
      - name: Verified hot shader release manifest and ABI guards
        run: |
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_hot_shader_overlay.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_abi_migration.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_live_memory_filter.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_pool_descriptor_dedup.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_watched_images.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_gpu_write_index.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_occlusion_fast.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_graphics_barrier_scopes.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_attachment_stage_dependencies.py -v
          cc -D_GNU_SOURCE -std=gnu11 -fsyntax-only dm/gfx/vk_android/vka_shlib.c
      - name: Syntax-check real Android Vulkan texture replay with NDK
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          python3 dm/games/game.py header 0400486024DEC000 "$RUNNER_TEMP/game_profile.h"
          INC=(-I "$RUNNER_TEMP" -I dm/gfx/nvn/include -I dm/third_party/vulkan-headers/include -I dm/third_party/libvpx -I dm/third_party/libvpx/config -I dm/third_party/stb_vorbis -I dm/host)
          "$CLANG" -std=gnu11 -D_GNU_SOURCE -DDM_NUP_ZSTD -O2 -fsyntax-only "${INC[@]}" dm/gfx/vk_android/vka_tex.c
      - name: On-device finalization retry regressions
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_pack_finalize_atomic.py -v
      - name: Test static engine integration against source versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java = Path('android/app/src/ondevice/java/dev/nxnative/android/PackService.java').read_text()
          assert 'OcarinaShaderDelta.keys(j)' in java
          assert '--hot-keys' in java
          assert 'ShaderResults.dropFailed(xlate)' in java
          assert 'DMSH_VK_DELTA_FROM' in java
          assert 'DMSH_VK_REQUIRE_ALL' in java
          assert 'DMSH_VK_RESULTS' in java
          assert 'j.resetChainSteps()' in java
          print('Old full/manifest-delta and abort/retry flows retained alongside selected-key fast update')
          PY
