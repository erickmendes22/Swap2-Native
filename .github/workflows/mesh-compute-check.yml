name: Mesh compute correctness (no APK)
on:
  push:
    branches: [ocarina-v11-ios-perf-from-v101, test/ocarina-qualcomm-mesh-route-ab-20261113, test/oot-gpu-task-index-short-search-20261113, test/oot-memu-render-enable-fuse-20261113]
    paths:
      - dm/gfx/vk_android/vka_memu*
      - dm/gfx/vk_android/memu/**
      - dm/gfx/tools/tests/test_memu_coalesced_readback.py
      - dm/gfx/tools/tests/test_memu_direct_payload.py
      - dm/gfx/tools/tests/test_oot_short_task_search.py
      - dm/gfx/tools/tests/test_oot_render_enable_boundaries.py
      - dm/gfx/tools/tests/test_oot_compute_hdr_vrs.py
      - dm/gfx/vk_android/vka_pso.c
      - dm/gfx/vk_android/vka_vrs_filter.h
      - dm/gfx/tools/tests/test_vrs_exclusion.py
      - dm/gfx/tools/tests/test_memu_plane_lut.py
      - dm/gfx/tools/tests/test_banana_input_caches.py
      - dm/gfx/tools/tests/test_memu_snapshot_rows.py
      - dm/host/tests/t_memu_snapshot_rows.c
      - dm/gfx/tools/tests/test_pool_bind_cache.py
      - dm/gfx/vk_android/vka_pool_bind_cache.h
      - dm/gfx/vk_android/selftest/pool_bind_gpu.c
      - dm/gfx/tools/tests/test_encoder_idle_cost.py
      - dm/host/tests/t_android_encoder_idle.c
      - dm/tools/tests/test_ocarina_encoder_idle_default.py
      - dm/gfx/tools/tests/test_ocarina_mesh_native_hybrid.py
      - dm/gfx/tools/tests/test_ocarina_mesh_caller_lookahead.py
      - dm/gfx/tools/tests/test_ocarina_vegetation_fast_path.py
      - dm/gfx/vk_android/vka_dev.c
      - dm/gfx/tools/tests/test_ocarina_mesh_route_ab.py
      - dm/host/tests/t_android_mesh_invariant.c
      - dm/gfx/vk_android/selftest/mesh_invariant.mesh
      - dm/gfx/vk_android/vka_shader.c
      - dm/gfx/tools/tests/test_selective_transfer_compute_gpu.py
      - dm/gfx/vk_android/selftest/selective_sync_gpu.c
      - dm/gfx/vk_android/selftest/selective_clear_gpu.c
      - dm/gfx/vk_android/vka_gprof.c
      - dm/gfx/tools/tests/test_prepare_barrier_gpu.py
      - dm/gfx/vk_android/selftest/prepare_barrier_gpu.c
      - dm/gfx/tools/tests/test_depth_fragment_elision.py
      - dm/gfx/tools/tests/test_depth_pass_optimizations.py
      - dm/gfx/vk_android/selftest/depth_pass_gpu.c
      - dm/gfx/tools/tests/test_partial_texture_upload.py
      - dm/host/tests/t_android_partial_upload.c
      - dm/gfx/tools/tests/test_shader_pool_deferral.py
      - dm/gfx/tools/tests/test_shader_pool_gpu.py
      - dm/gfx/nvn/nvn_mtl.h
      - dm/gfx/vk_android/selftest/shader_pool_gpu.c
      - dm/gfx/tools/tests/test_dead_gpu_retirement.py
      - dm/gfx/tools/tests/test_compute_guest_dedup.py
      - dm/gfx/vk_android/selftest/compute_guest_gpu.c
      - dm/gfx/nvn/hle_nvn.c
      - dm/gfx/vk_android/vka_tex.c
      - dm/gfx/vk_android/vka_exec.c
      - dm/gfx/vk_android/selftest/ub_dead_gpu.c
      - dm/gfx/tools/tests/test_ub_dead_gpu.py
      - dm/gfx/tools/tests/test_ocarina_pool_fb_direct.py
      - dm/gfx/vk_android/vka_enc.c
      - dm/host/tests/t_android_encoder_classic.c
      - dm/gfx/tools/tests/test_classic_encoder_order.py
      - dm/gfx/vk_android/vka_renderpass_cache.h
      - dm/gfx/vk_android/selftest/renderpass_gpu.c
      - dm/tools/tests/test_renderpass_cache_gpu.py
      - dm/gfx/vk_android/vka_ndsr*
      - dm/gfx/vk_android/fsr/ndsr_sgsr.comp
      - dm/gfx/vk_android/selftest/sgsr_reference.comp
      - dm/gfx/tools/tests/test_ocarina_168_sgsr_sampling.py
      - dm/gfx/vk_android/fsr/ndsr*
      - dm/gfx/vk_android/selftest/*sgsr*
      - dm/gfx/vk_android/selftest/ndsr_lvp.c
      - dm/tools/tests/test_ndsr_sgsr_gpu.py
      - dm/gfx/vk_android/vka_draw.c
      - dm/gfx/vk_android/vka_mem.c
      - dm/gfx/vk_android/vka_fd_alias.h
      - dm/host/tests/t_shared_buffer_retire.c
      - dm/tools/tests/test_ocarina_0185_shared_buffer.py
      - dm/gfx/vk_android/vka.h
      - dm/gfx/vk_android/vka_fragment_patch.h
      - dm/gfx/tools/fragment_gpu_probe.py
      - dm/tools/tests/test_fragment_gpu_probe.py
      - dm/gfx/vk_android/vka_spvpatch.c
      - dm/gfx/tools/tests/test_ocarina_compute_virtual_retile.py
      - dm/host/tests/compute/component_ids.spvasm
      - dm/gfx/tools/memu_plane_audit.py
      - dm/host/tests/memu/plane_fixture.py
      - dm/host/tests/t_android_memu*
      - .github/workflows/mesh-compute-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    # Use the same glslc toolchain as the signed APK and committed SGSR
    # header. Ubuntu 24.04 ships glslc 2023.8, while the reference
    # header was generated/validated with glslc 2026.1 on ubuntu-latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software driver and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan-dev spirv-tools glslang-tools glslc vulkan-validationlayers
          python3 - <<'PY'
          import glob, os
          paths = glob.glob('/usr/share/vulkan/icd.d/lvp*.json')
          assert len(paths) == 1, paths
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VK_ICD_FILENAMES=' + paths[0] + '\n')
          PY
      - name: Check committed NDSR SPIR-V matches corrected Vulkan GLSL
        run: python3 dm/gfx/vk_android/fsr/ndsr_spv.py --check
      - name: Verify Shared buffer draw gate and real Linux FD retirement
        run: python3 -m unittest discover -s dm/tools/tests -p test_ocarina_0185_shared_buffer.py -v
      - name: Validate shader-code pool deferral and every GPU address hook
        run: python3 -m unittest dm.gfx.tools.tests.test_shader_pool_deferral -v
      - name: Prove deferred pools still serve real GPU storage reads
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest dm.gfx.tools.tests.test_shader_pool_gpu -v
      - name: Validate finalized-pool retirement without live-content loss
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_dead_gpu_retirement.py -v
      - name: Compare compute publication absorbed by full guest barriers
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest dm.gfx.tools.tests.test_compute_guest_dedup dm.gfx.tools.tests.test_ocarina_compute_dispatch_overlap -v
      - name: Verify deferred uniform dead stores with actual Vulkan copies
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest dm.gfx.tools.tests.test_ub_dead_gpu dm.gfx.tools.tests.test_ocarina_ub_deferred dm.gfx.tools.tests.test_ocarina_scoped_uniform_barrier dm.gfx.tools.tests.test_ocarina_postpass_barrier_dedup -v
      - name: Verify task mesh row snapshots and actual encoder idle CPU/order
        run: python3 -m unittest dm.gfx.tools.tests.test_memu_snapshot_rows dm.gfx.tools.tests.test_encoder_idle_cost dm.tools.tests.test_ocarina_encoder_idle_default -v
      - name: Verify exact layout pool binding cache with actual GPU consumers
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest dm.gfx.tools.tests.test_pool_bind_cache -v
      - name: Prove Ocarina lower-resolution SGSR alignment and cave safety
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_168_sgsr_sampling.py -v
      - name: Validate SGSR1 pixels against independent Banana reference
        run: python3 -m unittest discover -s dm/tools/tests -p test_ndsr_sgsr_gpu.py -v
      - name: Exercise real encoder ring ordering and copied arguments
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_classic_encoder_order.py -v
      - name: Compare cached classic passes and dynamic rendering on Vulkan
        run: python3 -m unittest discover -s dm/tools/tests -p test_renderpass_cache_gpu.py -v
      - name: Verify unused-colour research parity with original depth pass ends
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: python3 -m unittest discover -s dm/tools/tests -p test_cave_query_gpu.py -v
      - name: Verify optional depth-pass formats and memory scopes on Vulkan
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_depth_pass_optimizations.py -v
      - name: Prove constant-colour fragment elision and exact depth/query parity
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_depth_fragment_elision.py -v
      - name: Check actual submission-prefix GPU ordering and clean preparation dedup
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_prepare_barrier_gpu.py -v
      - name: Compare actual selective copy compute indirect and clear dependencies
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_selective_transfer_compute_gpu.py -v
      - name: Verify partial texture uploads against full deswizzle and Vulkan readback
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_partial_texture_upload.py -v
      - name: Compile actual texture feedback ring policy and compare all texture IDs
        run: |
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pool_fb_direct.py' -v
      - name: Verify fragment comparison and negative control
        run: |
          python3 -m venv /tmp/fragment-probe-venv
          /tmp/fragment-probe-venv/bin/pip install vulkan==1.3.275.1 numpy==2.3.5
          /tmp/fragment-probe-venv/bin/python -m unittest discover -s dm/tools/tests -p test_fragment_gpu_probe.py -v
      - name: Compare actual GPU exports and generated vertex readers
        env:
          MEMU_TEST_VULKAN: '1'
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_memu_*.py' -v
      - name: Verify Vulkan GPU readback under short task index search
        env:
          MEMU_TEST_VULKAN: '1'
          DM_VK_MEMU_SHORT_TASK_SEARCH: '1'
        # The golden-module hash test belongs to the OLD default bytes,
        # not to an intentionally different shader compile-time variant.
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_memu_coalesced_readback.py -k test_gpu_exports_and_generated_vertex_reader -v
      - name: Verify direct read-only payloads on Vulkan
        env:
          MEMU_TEST_VULKAN: '1'
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_memu_direct_payload.py -v
      - name: Verify scalar component compute retile on the GPU
        env:
          MEMU_TEST_VULKAN: '1'
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_compute_virtual_retile.py -v
      - name: Differential-test <=256 workgroup task lookup against 17-step reference
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_oot_short_task_search.py -v
      - name: Validate scalar and coalesced task and mesh modules
        run: |
          cc -O1 -g -fsanitize=address,undefined \
            dm/host/tests/t_android_memu.c dm/gfx/vk_android/vka_memu_spv.c \
            dm/gfx/vk_android/vka_spvpatch.c dm/gfx/vk_android/vka_shlib.c \
            dm/third_party/zstd/zstddeclib.c -lm -o /tmp/memu-check
          ASAN_OPTIONS=detect_leaks=1 DM_VK_MEMU_COALESCED=0 /tmp/memu-check
          ASAN_OPTIONS=detect_leaks=1 DM_VK_MEMU_COALESCED=1 /tmp/memu-check
          # Actual generated GPU code for fast <=256 task search:
          ASAN_OPTIONS=detect_leaks=1 DM_VK_MEMU_COALESCED=1 DM_VK_MEMU_SHORT_TASK_SEARCH=1 /tmp/memu-check
      - name: Validate experimental Qualcomm native mesh depth/colour parity without depth discard
        run: |
          set -euxo pipefail
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            dm/host/tests/t_android_mesh_invariant.c dm/gfx/vk_android/vka_spvpatch.c \
            -o /tmp/mesh-invariant-check
          ASAN_OPTIONS=detect_leaks=1 /tmp/mesh-invariant-check
          glslc -O -fshader-stage=mesh --target-env=vulkan1.3 \
            dm/gfx/vk_android/selftest/mesh_invariant.mesh -o /tmp/mesh-invariant.spv
          spirv-val --target-env vulkan1.3 /tmp/mesh-invariant.spv
          ASAN_OPTIONS=detect_leaks=1 /tmp/mesh-invariant-check \
            /tmp/mesh-invariant.spv /tmp/mesh-invariant-patched.spv
          spirv-val --target-env vulkan1.3 /tmp/mesh-invariant-patched.spv
      - name: Verify VRS eligibility survives compute mesh conversion
        run: python3 -m unittest dm.gfx.tools.tests.test_oot_compute_hdr_vrs dm.gfx.tools.tests.test_vrs_exclusion dm.gfx.tools.tests.test_ocarina_fps_boost_vrs -v
      - name: Test real NVN mesh lookahead render-enable boundaries
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_oot_render_enable_boundaries.py -v
      - name: Check hybrid routing and caller ordering
        run: |
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_banana_input_caches.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_mesh_*.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_vegetation_fast_path.py -v
          python3 -m unittest discover -s dm/tools/tests -p test_android_perf_compare.py -v

  android-source-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual Android texture preparation and submission sources (no APK)
        shell: bash
        run: |
          set -euo pipefail
          SWAP_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -x "$SWAP_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358'
          fi
          SWAP_CC="$SWAP_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          "$SWAP_CC" -std=gnu11 -D_GNU_SOURCE -fsyntax-only \
            -Werror=implicit-function-declaration -Werror=return-type \
            -Idm/host/rt -Idm/host -Idm/gfx/nvn/include \
            -Idm/third_party/vulkan-headers/include \
            dm/gfx/vk_android/vka_tex.c dm/gfx/vk_android/vka_exec.c \
            dm/gfx/vk_android/vka_draw.c dm/gfx/vk_android/vka_gprof.c dm/gfx/vk_android/vka_enc.c
