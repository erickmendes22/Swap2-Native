name: Mesh compute correctness (no APK)
on:
  push:
    branches: [ocarina-v11-ios-perf-from-v101, test/ocarina-qualcomm-mesh-route-ab-20261113, test/oot-gpu-task-index-short-search-20261113, test/oot-memu-render-enable-fuse-20261113]
    paths:
      - dm/gfx/vk_android/vka_memu*
      - dm/gfx/vk_android/memu/**
      - dm/gfx/tools/tests/test_memu_coalesced_readback.py
      - dm/gfx/tools/tests/test_oot_short_task_search.py
      - dm/gfx/tools/tests/test_oot_render_enable_boundaries.py
      - dm/gfx/tools/tests/test_oot_compute_hdr_vrs.py
      - dm/gfx/vk_android/vka_pso.c
      - dm/gfx/tools/tests/test_memu_plane_lut.py
      - dm/gfx/tools/tests/test_banana_input_caches.py
      - dm/gfx/tools/tests/test_ocarina_mesh_native_hybrid.py
      - dm/gfx/tools/tests/test_ocarina_mesh_caller_lookahead.py
      - dm/gfx/tools/tests/test_ocarina_vegetation_fast_path.py
      - dm/gfx/vk_android/vka_dev.c
      - dm/gfx/tools/tests/test_ocarina_mesh_route_ab.py
      - dm/host/tests/t_android_mesh_invariant.c
      - dm/gfx/vk_android/selftest/mesh_invariant.mesh
      - dm/gfx/vk_android/vka_shader.c
      - dm/gfx/vk_android/vka_tex.c
      - dm/gfx/vk_android/vka_exec.c
      - dm/gfx/tools/tests/test_ocarina_pool_fb_direct.py
      - dm/gfx/vk_android/vka_enc.c
      - dm/host/tests/t_android_encoder_classic.c
      - dm/gfx/tools/tests/test_classic_encoder_order.py
      - dm/gfx/vk_android/vka_renderpass_cache.h
      - dm/gfx/vk_android/selftest/renderpass_gpu.c
      - dm/tools/tests/test_renderpass_cache_gpu.py
      - dm/gfx/vk_android/vka_ndsr*
      - dm/gfx/vk_android/fsr/ndsr*
      - dm/gfx/vk_android/selftest/*sgsr*
      - dm/gfx/vk_android/selftest/ndsr_lvp.c
      - dm/tools/tests/test_ndsr_sgsr_gpu.py
      - dm/gfx/vk_android/vka_draw.c
      - dm/gfx/vk_android/vka.h
      - dm/gfx/vk_android/vka_fragment_patch.h
      - dm/gfx/tools/fragment_gpu_probe.py
      - dm/tools/tests/test_fragment_gpu_probe.py
      - dm/gfx/vk_android/vka_spvpatch.c
      - dm/gfx/tools/tests/test_ocarina_compute_virtual_retile.py
      - dm/host/tests/compute/component_ids.spvasm
      - dm/gfx/tools/memu_plane_audit.py
      - dm/host/tests/memu/plane_fixture.py
      - dm/host/tests/t_android_memu*
      - .github/workflows/mesh-compute-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software driver and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan-dev spirv-tools glslang-tools glslc vulkan-validationlayers
          python3 - <<'PY'
          import glob, os
          paths = glob.glob('/usr/share/vulkan/icd.d/lvp*.json')
          assert len(paths) == 1, paths
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VK_ICD_FILENAMES=' + paths[0] + '\n')
          PY
      - name: Validate SGSR1 pixels against independent Banana reference
        run: python3 -m unittest discover -s dm/tools/tests -p test_ndsr_sgsr_gpu.py -v
      - name: Exercise real encoder ring ordering and copied arguments
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_classic_encoder_order.py -v
      - name: Compare cached classic passes and dynamic rendering on Vulkan
        run: python3 -m unittest discover -s dm/tools/tests -p test_renderpass_cache_gpu.py -v
      - name: Verify unused-colour research parity with original depth pass ends
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: python3 -m unittest discover -s dm/tools/tests -p test_cave_query_gpu.py -v
      - name: Compile actual texture feedback ring policy and compare all texture IDs
        run: |
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_pool_fb_direct.py' -v
      - name: Verify fragment comparison and negative control
        run: |
          python3 -m venv /tmp/fragment-probe-venv
          /tmp/fragment-probe-venv/bin/pip install vulkan==1.3.275.1 numpy==2.3.5
          /tmp/fragment-probe-venv/bin/python -m unittest discover -s dm/tools/tests -p test_fragment_gpu_probe.py -v
      - name: Compare actual GPU exports and generated vertex readers
        env:
          MEMU_TEST_VULKAN: '1'
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_memu_*.py' -v
      - name: Verify Vulkan GPU readback under short task index search
        env:
          MEMU_TEST_VULKAN: '1'
          DM_VK_MEMU_SHORT_TASK_SEARCH: '1'
        # The golden-module hash test belongs to the OLD default bytes,
        # not to an intentionally different shader compile-time variant.
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_memu_coalesced_readback.py -k test_gpu_exports_and_generated_vertex_reader -v
      - name: Verify scalar component compute retile on the GPU
        env:
          MEMU_TEST_VULKAN: '1'
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_compute_virtual_retile.py -v
      - name: Differential-test <=256 workgroup task lookup against 17-step reference
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_oot_short_task_search.py -v
      - name: Validate scalar and coalesced task and mesh modules
        run: |
          cc -O1 -g -fsanitize=address,undefined \
            dm/host/tests/t_android_memu.c dm/gfx/vk_android/vka_memu_spv.c \
            dm/gfx/vk_android/vka_spvpatch.c dm/gfx/vk_android/vka_shlib.c \
            dm/third_party/zstd/zstddeclib.c -lm -o /tmp/memu-check
          ASAN_OPTIONS=detect_leaks=1 DM_VK_MEMU_COALESCED=0 /tmp/memu-check
          ASAN_OPTIONS=detect_leaks=1 DM_VK_MEMU_COALESCED=1 /tmp/memu-check
          # Actual generated GPU code for fast <=256 task search:
          ASAN_OPTIONS=detect_leaks=1 DM_VK_MEMU_COALESCED=1 DM_VK_MEMU_SHORT_TASK_SEARCH=1 /tmp/memu-check
      - name: Validate experimental Qualcomm native mesh depth/colour parity without depth discard
        run: |
          set -euxo pipefail
          cc -std=c11 -O1 -g -fsanitize=address,undefined \
            dm/host/tests/t_android_mesh_invariant.c dm/gfx/vk_android/vka_spvpatch.c \
            -o /tmp/mesh-invariant-check
          ASAN_OPTIONS=detect_leaks=1 /tmp/mesh-invariant-check
          glslc -O -fshader-stage=mesh --target-env=vulkan1.3 \
            dm/gfx/vk_android/selftest/mesh_invariant.mesh -o /tmp/mesh-invariant.spv
          spirv-val --target-env vulkan1.3 /tmp/mesh-invariant.spv
          ASAN_OPTIONS=detect_leaks=1 /tmp/mesh-invariant-check \
            /tmp/mesh-invariant.spv /tmp/mesh-invariant-patched.spv
          spirv-val --target-env vulkan1.3 /tmp/mesh-invariant-patched.spv
      - name: Verify VRS eligibility survives compute mesh conversion
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_oot_compute_hdr_vrs.py -v
      - name: Test real NVN mesh lookahead render-enable boundaries
        run: python3 -m unittest discover -s dm/gfx/tools/tests -p test_oot_render_enable_boundaries.py -v
      - name: Check hybrid routing and caller ordering
        run: |
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_banana_input_caches.py -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_mesh_*.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_vegetation_fast_path.py -v
          python3 -m unittest discover -s dm/tools/tests -p test_android_perf_compare.py -v
