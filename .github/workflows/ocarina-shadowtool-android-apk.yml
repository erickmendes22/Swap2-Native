name: Ocarina Shadow Tool — Android APK

on:
  push:
    branches:
      - feature/ocarina-shadow-patcher-android
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ocarina-shadowtool-android-signing
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse signing key for future install-over updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ocarina-shadowtool-stable-debug-key-v1
      - name: Test safe BYML rewriting and build independent Android APK
        id: build
        run: |
          set -o pipefail
          chmod +x android/app/gradlew
          android/app/gradlew --no-daemon --stacktrace -p android/shadowtool :testDebugUnitTest :assembleDebug 2>&1 | tee shadowtool-build.log
      - name: Record concise build result in commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.build.outcome }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = success ]; then
            state=success
            description="Shadow Tool Android tests and APK build passed"
          else
            state=failure
            description="$(grep -E '^[[:space:]]*> Task .* FAILED|^.*error: |^.*Could not (find|resolve)|^.*FAILURE:' shadowtool-build.log 2>/dev/null | head -1 || true)"
            if [ -z "$description" ]; then description="Build failed; open workflow for detailed log"; fi
          fi
          description="$(printf '%.135s' "$description")"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="shadowtool/android-apk" \
            -f description="$description" -f target_url="$RUN_LINK"
      - name: Preserve build output for diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Ocarina-Shadow-Tool-Diagnostics
          path: |
            shadowtool-build.log
            android/shadowtool/build/test-results/
            android/shadowtool/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
      - name: Check APK and signatures
        run: |
          set -euxo pipefail
          APK="$(find android/shadowtool/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          mkdir -p output
          cp "$APK" output/Ocarina-Shadow-Tool.apk
          APK=output/Ocarina-Shadow-Tool.apk
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APK_SIGNER" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion:|launchable-activity'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Ocarina-Shadow-Tool-Android-APK
          path: output/Ocarina-Shadow-Tool.apk
          retention-days: 14
          if-no-files-found: error
