name: Ocarina visual quality A-B regression
on:
  push:
    branches: [research/ocarina-visual-quality-v2]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate both retained foliage pairs, fog cut and shadow compare sampler
        run: |
          python3 -m unittest dm.gfx.tools.tests.test_ocarina_visual_quality_patches -v
          python3 -m unittest dm.gfx.tools.tests.test_ocarina_effect_quality -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p test_ocarina_banana_runtime.py -v
      - name: Install Android NDK and CMake for native Vulkan compilation
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Compile Android launcher and source-level graphics patches
        shell: bash
        run: |
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon -PnxGames=0400486024DEC000 -PnxApp=ootv11ios -PnxPackEngine=fake compileDebugJavaWithJavac
      - name: Compile actual Vulkan backend including PCF and ground mist
        shell: bash
        run: |
          set -euxo pipefail
          python3 dm/gfx/vk_android/fsr/ndsr_spv.py
          python3 dm/gfx/vk_android/fsr/sgsr_spv.py
          python3 dm/gfx/vk_android/gsr2/gsr2_spv.py
          cmake -S android/host -B "$RUNNER_TEMP/vk-visual" -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=33 -DNX_RUNTIME_PROFILE=ON -DNX_LSFG=OFF
          cmake --build "$RUNNER_TEMP/vk-visual" --target nxhost -j 4
