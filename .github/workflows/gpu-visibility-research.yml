name: GPU visibility research (no APK)
on:
  push:
    branches: [research/ocarina-gpu-visibility-after-178]
    paths:
      - .github/workflows/gpu-visibility-research.yml
      - dm/gfx/vk_android/selftest/ndsr_lvp.c
      - dm/gfx/vk_android/selftest/conditional_visibility_gpu.c
      - dm/gfx/tools/tests/test_conditional_visibility_gpu.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan and synchronization validation
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan-dev spirv-tools glslang-tools vulkan-validationlayers
          python3 - <<'PY'
          import glob, os
          paths = glob.glob('/usr/share/vulkan/icd.d/lvp*.json')
          assert len(paths) == 1, paths
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('VK_ICD_FILENAMES=' + paths[0] + '\n')
          PY
      - name: Prove current-query visibility without stale results or CPU predicate reads
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest dm.gfx.tools.tests.test_conditional_visibility_gpu -v
      - name: Verify shared fixture still preserves original depth and query behavior
        env:
          MEMU_TEST_VULKAN: '1'
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
        run: python3 -m unittest dm.gfx.tools.tests.test_depth_pass_optimizations dm.tools.tests.test_cave_query_gpu -v
