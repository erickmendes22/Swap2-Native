name: Ocarina shadow RomFS inspector safety tests
on:
  push:
    paths:
      - 'dm/tools/gsys_shadowmaps.py'
      - 'dm/tools/gsys_shadow.py'
      - 'dm/gfx/vk_android/vka_draw.c'
      - 'dm/gfx/vk_android/vka_exec.c'
      - 'dm/gfx/tools/tests/test_oot_uniform_buffer_barrier.py'
      - 'dm/gfx/vk_android/vka_readonly_depth_store.h'
      - 'dm/gfx/tools/tests/test_ocarina_depth_store_none.py'
      - 'dm/gfx/tools/tests/test_depth_pass_optimizations.py'
      - 'dm/tools/oot_ssao_samples.py'
      - 'dm/tools/oot_post_effects.py'
      - 'dm/tools/oot_agl_pmaa.py'
      - 'dm/tools/tests/test_oot_agl_pmaa.py'
      - 'dm/tools/tests/test_oot_ssao_samples.py'
      - 'dm/tools/tests/test_oot_post_effects.py'
      - 'dm/tools/tests/test_oot_multi_fps_overlays.py'
      - 'dm/tools/tests/test_gsys_shadow.py'
      - 'dm/tools/tests/test_gsys_graphics_fps.py'
      - 'android/app/src/main/java/dev/nxnative/android/ShadowOverlay.java'
      - 'android/app/src/main/java/dev/nxnative/android/Prefs.java'
      - 'android/app/src/main/java/dev/nxnative/android/GameActivity.java'
      - 'android/app/src/main/java/dev/nxnative/android/GameSettings.java'
      - 'android/app/src/ondevice/java/dev/nxnative/android/SceneService.java'
      - 'dm/tools/tests/test_oot_shadowmap_overlay.py'
      - '.github/workflows/ocarina-shadowmap-tool-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test only verified shadow map BYML dimensions can be patched
        run: python3 -m unittest dm.tools.tests.test_oot_shadowmap_overlay -v
      - name: Verify exact Ocarina shadow-map field changes
        run: |
          python3 -m unittest dm.tools.tests.test_gsys_shadow dm.tools.tests.test_gsys_graphics_fps dm.tools.tests.test_oot_ssao_samples dm.tools.tests.test_oot_post_effects dm.tools.tests.test_oot_agl_pmaa dm.tools.tests.test_oot_multi_fps_overlays -v
          python3 -m py_compile dm/tools/gsys_shadow.py dm/tools/oot_ssao_samples.py dm/tools/oot_post_effects.py dm/tools/oot_agl_pmaa.py
          python3 dm/tools/gsys_shadow.py --help
      - name: Verify read-only 720p depth STORE_OP_NONE without changing VRS
        run: |
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_ocarina_depth_store_none.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_depth_pass_optimizations.py' -v
          python3 -m unittest discover -s dm/gfx/tools/tests -p 'test_oot_uniform_buffer_barrier.py' -v
      - name: Compile independent Android shadow overlay descriptor
        run: |
          mkdir -p /tmp/shadow-overlay-jvm
          javac -d /tmp/shadow-overlay-jvm android/app/src/main/java/dev/nxnative/android/ShadowOverlay.java
      - name: Check script CLI
        run: python3 dm/tools/gsys_shadowmaps.py --help
