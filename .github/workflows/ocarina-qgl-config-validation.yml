name: Ocarina Qualcomm QGL controls validation

on:
  push:
    branches:
      - ocarina-qgl-config-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocarina-qgl-config-test
  cancel-in-progress: true

jobs:
  verify-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run actual QGL Java logic with JVM mocks
        run: python3 -m unittest dm.tools.tests.test_ocarina_qgl_config -v

  compile-android:
    needs: verify-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          test -f "$NDK/source.properties"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Compile Android app Java UI and QGL settings
        shell: bash
        run: |
          set -euxo pipefail
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PnxGames=0400486024DEC000 \
            -PnxApp=ootv11ios \
            -PnxPackEngine=fake \
            -PnxBranchLabel=ocarina-qgl-test \
            compileDebugJavaWithJavac
      - name: Compile native Vulkan loader and QGL fopen hook with Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S android/host -B "$RUNNER_TEMP/qgl-native" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=33 \
            -DNX_RUNTIME_PROFILE=ON -DNX_LSFG=OFF
          cmake --build "$RUNNER_TEMP/qgl-native" \
            --target nxadreno hook_impl main_hook file_redirect_hook nxhost -j 4
          for name in nxadreno hook_impl main_hook file_redirect_hook nxhost; do
            find "$RUNNER_TEMP/qgl-native" -name "lib$name.so" -size +0c | grep -q .
          done
